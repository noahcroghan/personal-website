<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Noah Croghan</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="stylesheet" href="/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A portfolio which serves as source of my personal links on where to reach me."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <img id="headshot" src="/headshot.webp" alt="Headshot" />
    <div class="info" role="main">
      <h1>Noah Croghan</h1>
      <section id="links">
        <ul>
          <li>
            <a
              href="https://instagram.com/noahcroghan"
              target="_blank"
              aria-label="Instagram"
            >
              <i class="bi bi-instagram" aria-hidden="true"></i>
            </a>
          </li>
          <li>
            <a
              href="https://github.com/noahcroghan"
              target="_blank"
              aria-label="GitHub"
            >
              <i class="bi bi-github" aria-hidden="true"></i>
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/noah-croghan/"
              target="_blank"
              aria-label="LinkedIn"
            >
              <i class="bi bi-linkedin" aria-hidden="true"></i>
            </a>
          </li>
          <li>
            <a
              href="mailto:noahcroghan0@gmail.com"
              target="_blank"
              aria-label="Email"
            >
              <i class="bi bi-envelope-fill" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </section>
    </div>
    <footer>
      <div id="music-status" aria-live="polite"></div>
    </footer>
    <script src="/index.ts" type="module"></script>
  </body>
</html>
